name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Copy web app into the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ethnobotany.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ethnobotany-apk
          path: ethnobotany.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: European Ethnobotany & Pharmacognosy 1.0.${{ github.run_number }}
          body: |
            APK для Android. Скачайте ethnobotany.apk на телефон и откройте его (разрешите установку из этого источника).
            Новая версия ставится поверх старой, данные сохраняются.
          files: ethnobotany.apk
          make_latest: true
